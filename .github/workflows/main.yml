
name: Build DeathDimension

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract plugin source
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' -type f | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Source ZIP not found!"
            exit 1
          fi
          mkdir source
          unzip -q "$ZIP" -d source

      - name: Build plugin
        run: mvn -f source/pom.xml clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DeathDimension-JAR
          path: source/target/*.jar

